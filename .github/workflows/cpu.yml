name: CPU replay and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      DASHSCOPE_API_KEY: ""
      GOOGLE_API_KEY: ""
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked CPU test dependencies
        run: uv sync --frozen --extra dev --extra generation --extra eval
      - name: Validate selective repair cases without model inference
        run: uv run --no-sync python experiments/run_selective_repair.py --suite hard-budget-check --seed 82417 --output "${{ runner.temp }}/wspbench-repair"
      - name: Run CPU and mock-provider tests
        run: uv run --no-sync python -m pytest -q
