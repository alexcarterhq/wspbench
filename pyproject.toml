[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wspbench"
version = "0.2.2"
description = "Reproducible Read, Repair, Write evaluations of weight-space programming"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = ["numpy>=2.1,<3", "inspect-ai>=0.3", "python-dotenv>=1.0"]

[project.optional-dependencies]
generation = ["torch>=2.5"]
eval = ["openai>=2.0", "anthropic>=0.75"]
dev = ["pytest>=8.3"]

[project.scripts]
wspbench = "wspbench.cli:main"
wspbench-replay = "wspbench.public.replay:main"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/wspbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
